name: HOLOS safe editorial inventory
on:
  pull_request:
    paths:
      - 'scripts/editorial-safe-queue.py'
      - 'tests/editorial-safe-queue-test.py'
      - '.github/workflows/editorial-safe-queue.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * 1'
permissions:
  contents: read
concurrency:
  group: holos-safe-editorial-inventory
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'pull_request' || vars.HOLOS_FREE_QUOTA_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect only; do not publish
        run: |
          python3 scripts/editorial-safe-queue.py --out work/qa/editorial-review-candidates.json
          python3 tests/editorial-safe-queue-test.py
      - name: Save private-to-run review evidence (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: holos-editorial-audit-${{ github.run_id }}
          path: work/qa/editorial-review-candidates.json
          retention-days: 7
          if-no-files-found: error
