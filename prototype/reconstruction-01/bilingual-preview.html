<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOLOS 88 — Bilingual Preview</title><style>
:root{--ink:#171714;--paper:#f1eee5;--sage:#cbd0c5;--line:rgba(23,23,20,.45);--serif:Georgia,'Times New Roman',serif;--jp:'Hiragino Mincho ProN','Yu Mincho',serif;--sans:Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}a{color:inherit;text-decoration:none}.top{height:66px;padding:0 3vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font:28px var(--serif);letter-spacing:-.06em}.logo sub{font:9px;vertical-align:baseline;margin-left:3px}.switch{display:flex;border:1px solid}.switch button{width:54px;height:32px;border:0;background:transparent;font:9px var(--sans);letter-spacing:.14em}.switch button.on{background:var(--ink);color:#fff}.hero{min-height:calc(100vh - 66px);display:grid;grid-template-columns:1.16fr .84fr}.visual{position:relative;overflow:hidden;background:#aeb4aa}.globe{position:absolute;width:min(74vw,880px);aspect-ratio:1;border:1px solid;border-radius:50%;left:-20%;top:50%;translate:0 -50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.5),transparent 32%),#bcc0b6}.globe:before,.globe:after{content:"";position:absolute;inset:8%;border:1px solid rgba(23,23,20,.28);border-radius:50%}.globe:before{transform:scaleX(.34)}.globe:after{transform:scaleY(.34)}.visual small{position:absolute;left:2rem;bottom:2rem;font:8px var(--sans);letter-spacing:.16em}.copy{padding:7vw 4vw 4vw;display:flex;flex-direction:column}.eyebrow{font:8px var(--sans);letter-spacing:.16em}.copy h1{font:400 clamp(5rem,10vw,12rem)/.74 var(--serif);letter-spacing:-.075em;margin:auto 0 2rem}.copy h2{font:400 1.15rem/1.7 var(--jp);margin:0}.copy>p:last-of-type{max-width:34rem;font:13px/2 var(--jp);margin:2rem 0}.copy a{display:flex;justify-content:space-between;border:1px solid;padding:1rem;margin-top:2rem;font:8px var(--sans);letter-spacing:.14em}.article{padding:9rem 8vw;display:grid;grid-template-columns:.65fr 1.35fr;gap:7vw;border-top:1px solid}.article h2{font:400 clamp(4rem,8vw,9rem)/.76 var(--serif);letter-spacing:-.065em;margin:2rem 0}.article h3{font:400 1.25rem/1.6 var(--jp)}.body{max-width:690px}.body p{font:15px/2.05 var(--jp);margin:0 0 1.5rem}.letter{padding:7rem 8vw;background:#1a1b18;color:#f3efe6;display:grid;grid-template-columns:.7fr 1.3fr;gap:6vw}.letter h2{font:400 clamp(3.5rem,7vw,8rem)/.8 var(--serif);letter-spacing:-.06em;margin:2rem 0}.letter blockquote{font:400 clamp(1.35rem,2.2vw,2.25rem)/1.8 var(--jp);margin:0}.letter strong{display:block;margin-top:3rem;font:9px var(--sans);letter-spacing:.16em}.lang{transition:opacity .18s}.fade{opacity:.1}@media(max-width:760px){.hero,.article,.letter{grid-template-columns:1fr}.visual{min-height:48vh}.copy{min-height:55vh}.copy h1{font-size:19vw}.article,.letter{padding:5rem 1.2rem}.article h2{font-size:18vw}}
</style></head><body><header class="top"><a class="logo" href="/prototype/index.html">HOLOS<sub>88</sub></a><span class="eyebrow">BILINGUAL STUDY / NOT FINAL</span><div class="switch" aria-label="Language"><button class="on" data-language="ja">JP</button><button data-language="en">EN</button></div></header><main class="lang" id="content"></main><script>
const copy={ja:{kicker:'THE LIVING ATLAS / 世界への入口',title:'THE LIVING<br>ATLAS',subtitle:'世界は、どこからでも始められる。',intro:'地球を回して、ひとつの土地へ。そこに残る古い地図、音、歴史、気候、文化、そしてHOLOS 88の記事を重ねていきます。',enter:'地球を回す',visual:'PLACE × TIME × RELATIONSHIP',articleKicker:'MUSEUM ESSAY / ECHO',articleTitle:'THE CABINET<br>THAT THOUGHT',articleSub:'AIより前に、思考するカード箱があった',p1:'人は、頭の中だけで考えているのだろうか。机に一枚のカードを置き、その隣へ別のカードを置く。二つの記録が出会った瞬間、それまで見えなかった関係が姿を現す。',p2:'知識は、保存しただけでは動かない。並べ替え、離し、もう一度近づける。その小さな手仕事の中で、思考は自分の外へ出て、世界と相談を始める。',letterTitle:'A LETTER FROM<br>TEAM HOLOS',letterSub:'読み終えた、あなたへ。',letter:'今日、答えが出なかったことを、頭の中だけに置いておかなくてもいいのかもしれません。机の上へ出して、少し遠くから眺めてみる。隣に置く一枚を変えたとき、問いの形も変わることがあります。',team:'TEAM HOLOS'},en:{kicker:'THE LIVING ATLAS / AN ENTRANCE TO THE WORLD',title:'THE LIVING<br>ATLAS',subtitle:'The world can begin anywhere.',intro:'Turn the globe and choose a place. We layer its old maps, sounds, histories, climate, culture, and the windows of HOLOS 88.',enter:'TURN THE EARTH',visual:'PLACE × TIME × RELATIONSHIP',articleKicker:'MUSEUM ESSAY / ECHO',articleTitle:'THE CABINET<br>THAT THOUGHT',articleSub:'Before AI, there was a box of cards that could think.',p1:'Do we think only inside our heads? Place one card on a desk, then another beside it. The moment two records meet, a relationship that had remained invisible begins to appear.',p2:'Knowledge does not move simply because it has been stored. We rearrange it, create distance, and bring it close again. Through that small work of the hands, thought steps outside us and begins to consult the world.',letterTitle:'A LETTER FROM<br>TEAM HOLOS',letterSub:'For you, at the end of this window.',letter:'Perhaps the question that found no answer today does not have to remain inside your head. Place it on the table and look from a little farther away. When the card beside it changes, the shape of the question may change too.',team:'TEAM HOLOS'}};
function render(lang){const c=copy[lang],root=document.querySelector('#content');document.documentElement.lang=lang;root.classList.add('fade');setTimeout(()=>{root.innerHTML=`<section class="hero"><div class="visual"><div class="globe"></div><small>${c.visual}</small></div><div class="copy"><p class="eyebrow">${c.kicker}</p><h1>${c.title}</h1><h2>${c.subtitle}</h2><p>${c.intro}</p><a href="/prototype/time-atlas/index.html"><span>${c.enter}</span><b>↗</b></a></div></section><section class="article"><header><p class="eyebrow">${c.articleKicker}</p><h2>${c.articleTitle}</h2><h3>${c.articleSub}</h3></header><div class="body"><p>${c.p1}</p><p>${c.p2}</p></div></section><section class="letter"><header><p class="eyebrow">ENCOUNTER / EXIT WINDOW</p><h2>${c.letterTitle}</h2><p>${c.letterSub}</p></header><div><blockquote>${c.letter}</blockquote><strong>${c.team}</strong></div></section>`;root.classList.remove('fade')},180);document.querySelectorAll('[data-language]').forEach(b=>b.classList.toggle('on',b.dataset.language===lang));localStorage.setItem('holos88-preview-language',lang)}
document.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>render(b.dataset.language));render(localStorage.getItem('holos88-preview-language')||'ja');
</script></body></html>
